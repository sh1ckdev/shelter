services:
  backend:
    container_name: shelter-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5000}
      DB_URL: ${DB_URL:-mongodb://admin:adminpassword@mongo:27017/shelter?authSource=admin}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    depends_on:
      - mongo
    volumes:
      - static_data:/app/static
    ports:
      - "${PORT:-5000}:5000"
    restart: unless-stopped
    networks:
      - shelter-net

  mongo:
    image: mongo:6.0
    container_name: shelter-mongo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-adminpassword}
    volumes:
      - mongo_data:/data/db
    networks:
      - shelter-net

volumes:
  mongo_data:
  static_data:

networks:
  shelter-net:
    driver: bridge
